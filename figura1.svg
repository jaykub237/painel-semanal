<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <rect width="1000" height="630" fill="#ffffff"/>
  <text x="60" y="62" font-size="22" font-weight="700" fill="#1e2a33">Os três eixos temáticos e sua interseção</text>
  <text x="60" y="87" font-size="13.5" fill="#4a5a66">Segurança e sustentabilidade na Amazônia</text>

  <circle cx="270" cy="285" r="150" fill="#264b63" fill-opacity="0.26" stroke="#264b63" stroke-width="1.6"/>
  <circle cx="500" cy="285" r="150" fill="#dfe635" fill-opacity="0.40" stroke="#c2cb22" stroke-width="1.6"/>
  <circle cx="730" cy="285" r="150" fill="#1a9e6e" fill-opacity="0.28" stroke="#12925f" stroke-width="1.6"/>

  <g fill="#1f4a63" text-anchor="middle">
    <text x="255" y="257" font-size="16" font-weight="700" letter-spacing="3">EIXO 1</text>
    <text x="255" y="282" font-size="14" font-weight="700">Soberania, Defesa</text>
    <text x="255" y="300" font-size="14" font-weight="700">e Presença Estatal</text>
    <text x="255" y="318" font-size="14" font-weight="700">Integrada</text>

    <text x="500" y="257" font-size="16" font-weight="700" letter-spacing="3">EIXO 2</text>
    <text x="500" y="282" font-size="14" font-weight="700">Bioeconomia e</text>
    <text x="500" y="300" font-size="14" font-weight="700">Economias Ilícitas</text>
    <text x="500" y="318" font-size="14" font-weight="700">na Amazônia</text>

    <text x="745" y="257" font-size="16" font-weight="700" letter-spacing="3">EIXO 3</text>
    <text x="745" y="282" font-size="14" font-weight="700">Governança e</text>
    <text x="745" y="300" font-size="14" font-weight="700">Fortalecimento</text>
    <text x="745" y="318" font-size="14" font-weight="700">Institucional</text>
  </g>

  <g font-size="13.5" fill="#1e2a33">
    <rect x="60" y="478" width="16" height="16" rx="3" fill="#264b63"/>
    <text x="84" y="491">Eixo 1 · Soberania, Defesa e Presença Estatal Integrada</text>
    <rect x="60" y="504" width="16" height="16" rx="3" fill="#d6de1e"/>
    <text x="84" y="517">Eixo 2 · Bioeconomia e Economias Ilícitas na Amazônia</text>
    <rect x="60" y="530" width="16" height="16" rx="3" fill="#12925f"/>
    <text x="84" y="543">Eixo 3 · Governança e Fortalecimento Institucional</text>
  </g>

  <line x1="60" y1="572" x2="940" y2="572" stroke="#e3e7ea" stroke-width="1"/>
  <text x="60" y="597" font-size="11" fill="#6b7780">Fonte: Centro Soberania e Clima.</text>
</svg>
