<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Painel semanal de progresso — áreas, frentes, rotinas e histórico.">
<title>Painel Semanal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="pular" href="#palco">Pular para o conteúdo</a>

<div class="app" id="app">

  <aside class="side" id="side" aria-label="Navegação principal">
    <div class="side-topo">
      <div class="marca">
        <span class="marca-p"></span>
        <span class="marca-t"><b>Painel</b><small>semanal</small></span>
      </div>
      <button class="sfech" id="sfech" aria-label="Fechar navegação" title="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="side-semana">
      <button class="wbtn" id="prev" title="Semana anterior (←)" aria-label="Semana anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="wlabel" id="today" title="Voltar para a semana atual">
        <b id="wkey">—</b>
        <small id="wrange">—</small>
      </button>
      <button class="wbtn" id="next" title="Próxima semana (→)" aria-label="Próxima semana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="side-anel">
      <div class="ring" id="ring">
        <svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true">
          <circle cx="29" cy="29" r="24" fill="none" stroke="var(--line)" stroke-width="6"/>
          <circle id="ringarc" cx="29" cy="29" r="24" fill="none" stroke="var(--accent)" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8" transform="rotate(-90 29 29)"/>
        </svg>
        <div class="ring-txt">
          <div class="num mono" id="overall">0%</div>
          <div class="cap" id="ringcap">semana</div>
        </div>
      </div>
      <div class="streak hidden" id="streak" title="">
        <span class="sfogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.5 3 4.5 4.2 4.5 8a4.5 4.5 0 0 1-9 0c0-1.4.6-2.3 1.3-3.2.5 1 1.2 1.5 2 1.5C11 7.5 10.5 5 12 3z"/><path d="M8.5 15.5c0 2.5 1.6 4.5 3.5 4.5s3.5-2 3.5-4.5"/></svg></span>
        <b id="streakn"></b><span id="streakt"></span>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="veu" id="veu" hidden></div>

  <div class="col">
    <header class="topo">
      <button class="ham" id="abrirside" aria-label="Abrir navegação" title="Navegação">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="migalha" id="migalha" aria-label="Localização"></nav>
      <div class="topo-dir">
        <div class="busca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Buscar atividade ou #etiqueta" autocomplete="off">
        </div>
        <button class="ib" id="maisacoes" data-menu-id="acoes" aria-haspopup="menu" title="Ações da semana">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
    </header>

    <main class="palco" id="palco" tabindex="-1"></main>
  </div>
</div>

<aside class="gaveta" id="gaveta" aria-hidden="true" aria-label="Detalhe do item"></aside>
<div class="gveu" id="gveu" hidden></div>

<template id="tpl-agenda">
  <div class="secao">
    <div id="agenda"></div>
  </div>
</template>

<template id="tpl-retro">
  <div class="retro">
    <h2>Retrospectiva</h2>
    <p class="hint">Fechamento da semana. Preenchido, aparece no histórico e no relatório exportado.</p>
    <div class="retro-grid">
      <div class="field"><label for="r-win">O que funcionou</label><textarea id="r-win" data-retro="win" placeholder="Entregas, decisões, hábitos que pegaram…"></textarea></div>
      <div class="field"><label for="r-block">O que travou</label><textarea id="r-block" data-retro="block" placeholder="Obstáculos, estimativas erradas, interrupções…"></textarea></div>
      <div class="field"><label for="r-next">Foco da próxima semana</label><textarea id="r-next" data-retro="next" placeholder="A única coisa que não pode ficar para depois…"></textarea></div>
    </div>
    <div class="scale">
      <div class="s"><label>Energia</label><div id="sc-energy"></div></div>
      <div class="s"><label>Satisfação</label><div id="sc-mood"></div></div>
    </div>
  </div>
</template>

<template id="tpl-rotinas">
  <div class="panel">
    <h2>Rotinas</h2>
    <p class="hint">O que se repete sozinho toda semana, sem você recriar. <b>Frequência</b> é meta de quantidade — treinar 4×, ler 3×. <b>Diária</b> acontece em dias determinados, com horário e período opcionais, e aparece na agenda e na visão do dia; pode ser dividida em etapas que se repetem todo dia.</p>
    <div id="habits"></div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="hname" type="text" placeholder="Nome da rotina" style="border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13.5px;flex:1;min-width:160px">
      <select id="hsub" style="border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13.5px"></select>
      <input id="htarget" class="num" type="number" min="1" max="21" value="3" style="border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-family:var(--mono);width:64px;text-align:center">
      <span style="font-size:13px;color:var(--ink-3)">× por semana</span>
      <button class="btn" id="addHabit">+ Frequência</button>
      <button class="btn pri" id="addDaily">+ Diária</button>
    </div>
  </div>
</template>

<template id="tpl-hist">
  <div class="anhead">
    <h2>Como foi a semana</h2>
    <span id="anweek" class="mono"></span>
  </div>
  <div id="analise"></div>

  <div class="anhead segunda">
    <h2>Ao longo do tempo</h2>
  </div>
  <div class="stats" id="stats"></div>
  <div class="panel">
    <h2>Evolução</h2>
    <p class="hint">Percentual concluído por semana. A linha grossa é o total; as finas, cada área.</p>
    <div class="chartwrap"><svg id="chart" height="200" role="img" aria-label="Gráfico de evolução semanal"></svg></div>
    <div class="legend" id="chartleg"></div>
  </div>
  <div class="panel">
    <h2>Por frente</h2>
    <p class="hint">Média das últimas <span id="lookback">8</span> semanas registradas, com a trajetória ao lado.</p>
    <div class="chartwrap"><table class="hist" id="subtable"></table></div>
  </div>
  <div class="panel">
    <h2>Pontos de atenção</h2>
    <p class="hint">Sinais de desequilíbrio entre as frentes.</p>
    <div id="alerts"></div>
  </div>
  <div class="panel">
    <h2>Semanas registradas</h2>
    <div class="chartwrap"><table class="hist" id="weektable"></table></div>
  </div>
</template>

<template id="tpl-set">
  <div class="panel">
    <h2>Categorias</h2>
    <p class="hint">Renomeie, reordene arrastando ou acrescente frentes. Excluir uma frente apaga também as atividades ligadas a ela.</p>
    <div id="cats"></div>
    <div style="margin-top:14px"><button class="btn" id="addArea">+ Nova área</button></div>
  </div>
  <div class="panel">
    <h2>Preferências</h2>
    <div class="setrow"><div class="grow">Tema</div>
      <div class="seg" id="theme">
        <button data-t="auto" aria-pressed="true">Automático</button>
        <button data-t="light" aria-pressed="false">Claro</button>
        <button data-t="dark" aria-pressed="false">Escuro</button>
      </div>
    </div>
    <div class="setrow"><div class="grow">Meta semanal <small style="color:var(--ink-3)">— percentual que conta como semana boa na sequência</small></div>
      <input class="num" id="goalpct" type="number" min="10" max="100" step="5">
    </div>
    <div class="setrow"><div class="grow">Atividade em andamento vale <small style="color:var(--ink-3)">— crédito parcial no cálculo</small></div>
      <input class="num" id="partial" type="number" min="0" max="100" step="5">
    </div>
    <div class="setrow"><div class="grow">Lembrete ao abrir o painel <small style="color:var(--ink-3)">— um recado seu, para reforçar o que importa</small></div>
      <div class="seg" id="lemfreq">
        <button data-lf="sempre" aria-pressed="false">Toda vez</button>
        <button data-lf="dia" aria-pressed="true">1× por dia</button>
        <button data-lf="off" aria-pressed="false">Desligado</button>
      </div>
    </div>
    <div class="setrow" style="align-items:flex-start">
      <div class="grow">
        <label for="lemtxt" class="rot">Mensagem</label>
        <textarea id="lemtxt" rows="3" placeholder="Ex: esta semana é o capítulo 2 — o resto pode esperar." style="width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.5;resize:vertical"></textarea>
      </div>
      <button class="btn" id="lemver" style="margin-top:22px">Ver</button>
    </div>
    <div class="setrow"><div class="grow">Adiar desconta a semana de origem <small style="color:var(--ink-3)">— o que foi adiado continua no denominador da semana em que era para ter saído</small></div>
      <div class="seg" id="pushpen">
        <button data-pp="1" aria-pressed="true">Sim</button>
        <button data-pp="0" aria-pressed="false">Não</button>
      </div>
    </div>
    <div class="setrow"><div class="grow">Bônus ao concluir o que foi adiado <small style="color:var(--ink-3)">— percentual extra sobre o peso do item, na semana seguinte</small></div>
      <input class="num" id="pushbonus" type="number" min="0" max="50" step="5">
    </div>
    <div class="setrow"><div class="grow">Tempo que já pede peso 2 <small style="color:var(--ink-3)">— em minutos; abaixo disso a sugestão é peso 1</small></div>
      <input class="num" id="tmedio" type="number" min="5" max="480" step="5">
    </div>
    <div class="setrow"><div class="grow">Tempo que já pede peso 3 <small style="color:var(--ink-3)">— em minutos</small></div>
      <input class="num" id="talto" type="number" min="10" max="960" step="10">
    </div>
  </div>
  <div class="panel">
    <h2>Lixeira</h2>
    <p class="hint">Atividades e subetapas excluídas nos últimos 60 dias, no máximo 60 itens. Restaurar devolve cada uma à semana de onde saiu.</p>
    <div id="trash"></div>
    <div style="margin-top:14px"><button class="btn dgr" id="emptyTrash">Esvaziar lixeira</button></div>
  </div>
  <div class="panel">
    <h2>Sincronização</h2>
    <p class="hint">Guarda o painel num Gist privado do GitHub, para abrir em qualquer dispositivo. O token fica só neste navegador — nunca entra no Gist nem no backup exportado.</p>
    <div class="setrow">
      <div class="grow">
        <label for="ghtoken" class="rot">Token de acesso</label>
        <input id="ghtoken" type="password" autocomplete="off" spellcheck="false" placeholder="cole aqui o fine-grained token com permissão Gists: read and write">
      </div>
      <button class="btn" id="ghsavetok">Salvar</button>
    </div>
    <div class="setrow">
      <div class="grow">
        <label for="ghgist" class="rot">Gist</label>
        <input id="ghgist" type="text" autocomplete="off" spellcheck="false" placeholder="deixe vazio — o primeiro envio cria um Gist privado">
      </div>
    </div>
    <div class="setrow">
      <div class="grow">Sincronizar automaticamente <small style="color:var(--ink-3)">— envia sozinho alguns segundos depois de cada alteração, e puxa ao abrir</small></div>
      <div class="seg" id="ghauto">
        <button data-a="1" aria-pressed="false">Ligado</button>
        <button data-a="0" aria-pressed="true">Desligado</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px">
      <button class="btn pri" id="ghpush">Enviar para o GitHub</button>
      <button class="btn" id="ghpull">Puxar do GitHub</button>
      <span id="ghstatus" class="hint" style="margin:0;font-size:12.5px"></span>
    </div>
  </div>
  <div class="panel">
    <h2>Dados</h2>
    <p class="hint">Cópia local no navegador. Mesmo com a sincronização ligada, exporte um backup de tempos em tempos.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="expjson">Exportar backup (.json)</button>
      <button class="btn" id="impjson">Importar backup</button>
      <input type="file" id="file" accept="application/json" class="hidden">
      <button class="btn dgr" id="reset">Apagar tudo</button>
    </div>
    <p class="hint" style="margin:14px 0 0">Atalhos: <span class="mono">←</span> <span class="mono">→</span> mudam de semana · <span class="mono">/</span> foca a busca · <span class="mono">Esc</span> limpa · <span class="mono">!2</span> ou <span class="mono">!3</span> no fim do texto define o peso · <span class="mono">#etiqueta</span> vira marcador.</p>
  </div>
</template>

<div class="mask" id="mask" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <div class="dlg">
    <h3 id="dlg-t"></h3>
    <p id="dlg-m"></p>
    <div class="row">
      <button class="btn" id="dlg-no">Cancelar</button>
      <button class="btn danger" id="dlg-yes">Excluir</button>
    </div>
  </div>
</div>

<div class="mask" id="lmask" role="dialog" aria-modal="true" aria-labelledby="lem-t">
  <div class="dlg lembrete">
    <h3 id="lem-t">Antes de começar</h3>
    <p class="lem-txt" id="lem-txt"></p>
    <textarea id="lem-edit" class="hidden" rows="4" placeholder="O que você não pode perder de vista nesta semana?" aria-label="Mensagem do lembrete"></textarea>
    <div class="row">
      <button class="btn" id="lem-editar">Editar</button>
      <button class="btn pri" id="lem-ok">Começar</button>
    </div>
  </div>
</div>

<datalist id="taglist"></datalist>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
